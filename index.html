<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY LIFE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="main.css?v=2">
</head>
<body>
<div class="app" id="app">

  <!-- ====== MAIN SHELL ====== -->
  <div id="shell" style="display:none;">
    <div class="topbar">
      <div class="brand">MY LIFE</div>
      <div class="avatar-btn" id="avatarBtn" onclick="App.go('settings')">
        <img id="avatarImg" style="width:100%;height:100%;border-radius:50%;display:none;" alt="">
        <span id="avatarInitial">我</span>
      </div>
    </div>

    <!-- ---- HOME ---- -->
    <div class="view" id="view-home">
      <div class="date-hero">
        <div class="date-big" id="homeDateBig">--</div>
        <div class="date-sub"><span class="dow" id="homeDow">--</span><span id="homeLunarNote">今天也要好好生活 ☺</span></div>
      </div>
      <div class="grid4">
        <div class="card4 c-daily" onclick="App.go('daily')"><div class="tab"></div><div class="card4-content"><div><h3>日常筆記</h3><div class="meta" id="sumDaily">尚無紀錄</div></div><div class="icon"><i class="ph ph-notebook"></i></div></div></div>
        <div class="card4 c-money" onclick="App.go('money')"><div class="tab"></div><div class="card4-content"><div><h3>記帳</h3><div class="meta" id="sumMoney">尚無紀錄</div></div><div class="icon"><i class="ph ph-wallet"></i></div></div></div>
        <div class="card4 c-item" onclick="App.go('items')"><div class="tab"></div><div class="card4-content"><div><h3>消耗品記錄</h3><div class="meta" id="sumItems">尚無紀錄</div></div><div class="icon"><i class="ph ph-package"></i></div></div></div>
        <div class="card4 c-note" onclick="App.go('articles')"><div class="tab"></div><div class="card4-content"><div><h3>備忘錄</h3><div class="meta" id="sumArticles">尚無紀錄</div></div><div class="icon"><i class="ph ph-file-text"></i></div></div></div>
      </div>
      <div class="section-title"><h2>今日代辦</h2><span class="more" onclick="App.go('calendar')">查看行事曆 →</span></div>
      <div id="homeTodos"></div>
    </div>

    <!-- ---- CALENDAR ---- -->
    <div class="view" id="view-calendar">
      <div class="page-head"><h1>行事曆</h1><span class="page-tag" style="background:var(--c-cal-bg); color:var(--c-cal);">Calendar</span></div>
      <div class="tabs">
        <button class="tab-btn" id="calTabWeek" onclick="Calendar.setMode('week')">週檢視</button>
        <button class="tab-btn" id="calTabMonth" onclick="Calendar.setMode('month')">月檢視</button>
      </div>
      <div class="cal-head">
        <div class="cal-nav"><button class="icbtn" onclick="Calendar.shift(-1)">‹</button></div>
        <div class="mth" id="calLabel">--</div>
        <div class="cal-nav"><button class="icbtn" onclick="Calendar.shift(1)">›</button></div>
      </div>
      <div id="calWeekView" class="wk-strip"></div>
      <div id="calMonthView" style="display:none;">
        <div class="mon-grid" id="monGridHead"></div>
        <div class="mon-grid" id="monGridBody"></div>
      </div>
      <div class="day-panel">
        <div class="section-title" style="margin-top:6px;"><h2 id="dayPanelTitle">今天</h2></div>
        <div id="dayAutoItems"></div>
        <div id="dayTodoList"></div>
        <div class="add-todo-row">
          <input type="text" id="newTodoInput" placeholder="新增待辦事項…">
          <button class="btn btn-primary" onclick="Calendar.addTodo()">加入</button>
        </div>
      </div>
    </div>

    <!-- ---- DAILY NOTES ---- -->
    <div class="view" id="view-daily">
      <div class="page-head"><h1>日常筆記</h1><span class="page-tag" style="background:var(--c-daily-bg); color:var(--c-daily);">Daily</span></div>
      <div class="tabs">
        <button class="tab-btn active" id="dTabPlan" onclick="Daily.setTab('plan')">計劃表</button>
        <button class="tab-btn" id="dTabChart" onclick="Daily.setTab('chart')">圖表</button>
        <button class="tab-btn" id="dTabReview" onclick="Daily.setTab('review')">檢討簿</button>
        <button class="tab-btn" id="dTabDiary" onclick="Daily.setTab('diary')">日記簿</button>
      </div>
      <div id="dailyPlanPane"></div>
      <div id="dailyChartPane" style="display:none;"></div>
      <div id="dailyReviewPane" style="display:none;"></div>
      <div id="dailyDiaryPane" style="display:none;"></div>
    </div>

    <!-- ---- MONEY ---- -->
    <div class="view" id="view-money">
      <div class="page-head"><h1>記帳</h1><span class="page-tag" style="background:var(--c-money-bg); color:var(--c-money);">Money</span></div>
      <div class="pocket-scroll" id="pocketScroll"></div>
      <div class="tabs">
        <button class="tab-btn active" id="mTabList" onclick="Money.setTab('list')">明細</button>
        <button class="tab-btn" id="mTabStat" onclick="Money.setTab('stat')">分析</button>
        <button class="tab-btn" id="mTabTransfer" onclick="Money.setTab('transfer')">轉帳</button>
      </div>
      <div id="moneyListPane"></div>
      <div id="moneyStatPane" style="display:none;"></div>
      <div id="moneyTransferPane" style="display:none;"></div>
    </div>

    <!-- ---- ITEMS ---- -->
    <div class="view" id="view-items">
      <div class="page-head"><h1>消耗品記錄</h1><span class="page-tag" style="background:var(--c-item-bg); color:var(--c-item);">Items</span></div>
      <div class="tabs">
        <button class="tab-btn active" id="iTabItems" onclick="Items.setTab('items')">消耗品清單</button>
        <button class="tab-btn" id="iTabChores" onclick="Items.setTab('chores')">瑣事管理</button>
        <button class="tab-btn" id="iTabWeek" onclick="Items.setTab('week')">週檢視</button>
        <button class="tab-btn" id="iTabMonth" onclick="Items.setTab('month')">月檢視</button>
      </div>
      <div id="itemsPane"></div>
      <div id="choresPane" style="display:none;"></div>
      <div id="itemsWeekPane" style="display:none;"></div>
      <div id="itemsMonthPane" style="display:none;"></div>
    </div>

    <!-- ---- ARTICLES ---- -->
    <div class="view" id="view-articles">
      <div class="page-head"><h1>備忘錄</h1><span class="page-tag" style="background:var(--c-note-bg); color:var(--c-note);">Memo</span></div>
      <div class="tabs" id="articleTabs"></div>
      <div id="articlesList"></div>
    </div>

    <!-- ---- SETTINGS ---- -->
    <div class="view" id="view-settings">
      <div class="page-head"><h1>設定</h1></div>
      <div class="profile-box">
        <div class="av" id="setAvatar">我</div>
        <div><div class="nm" id="setName">--</div><div class="em" id="setEmail">--</div></div>
      </div>
      <div class="section-title"><h2>外觀主題</h2></div>
      <div class="theme-row" id="themeRow"></div>
      <div class="section-title"><h2>功能顏色</h2></div>
      <div style="font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;">自訂每個功能區塊的主題色</div>
      <div id="moduleColorRow"></div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="Settings.resetModuleColors()">還原預設顏色</button>
      <div class="section-title"><h2>頁面排序</h2></div>
      <div style="font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;">調整底部導覽列的順序</div>
      <div id="orderList"></div>
      <div class="section-title"><h2>帳號</h2></div>
      <button class="btn btn-ghost btn-block" onclick="Auth.logout()"><i class="ph ph-sign-out"></i> 登出帳號</button>
      <div class="section-title"><h2>資料</h2></div>
      <button class="btn btn-ghost btn-block" style="color:#a1503e;" onclick="App.clearAllData()"><i class="ph ph-trash"></i> 清空所有資料</button>
      <div style="height:20px;"></div>
    </div>

    <div class="bottom-nav" id="bottomNav"></div>
    <button class="fab" id="fabBtn" onclick="App.onFab()"><i class="ph ph-plus"></i></button>
  </div>
</div>

<!-- ====== MODAL SHEET ====== -->
<div class="overlay" id="overlay" onclick="if(event.target===this)App.closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<script src="utils.js?v=2"></script>
<script src="db.js?v=2"></script>
<script src="auth.js?v=2"></script>
<script src="home.js?v=2"></script>
<script src="daily.js?v=2"></script>
<script src="money.js?v=2"></script>
<script src="items.js?v=2"></script>
<script src="articles.js?v=2"></script>
<script src="calendar.js?v=2"></script>
<script src="settings.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
